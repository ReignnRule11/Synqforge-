name: PostgreSQL security tests

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  postgres-permissions:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: synqforge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d synqforge_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Apply migrations and run RLS/bootstrap tests
        env:
          MIGRATION_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/synqforge_test
        run: bash scripts/test-postgres-permissions.sh
      - name: Provision dedicated least-privilege runtime login
        env:
          ADMIN_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/synqforge_test
        run: |
          psql "$ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'synqforge_test_runtime') THEN
              CREATE ROLE synqforge_test_runtime LOGIN PASSWORD 'ci-runtime-password' NOINHERIT NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS;
            ELSE
              ALTER ROLE synqforge_test_runtime LOGIN PASSWORD 'ci-runtime-password' NOINHERIT NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS;
            END IF;
          END
          $$;
          GRANT synqforge_app TO synqforge_test_runtime;
          SQL
      - name: Test server transaction identity and least-privilege pooled isolation
        env:
          ADMIN_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/synqforge_test
          DATABASE_URL: postgresql://synqforge_test_runtime:ci-runtime-password@localhost:5432/synqforge_test
        run: npm run test:postgres-runtime
