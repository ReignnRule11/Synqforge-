name: PostgreSQL security tests

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  postgres-permissions:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: synqforge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d synqforge_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Apply migrations and run RLS/bootstrap tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/synqforge_test
        run: bash scripts/test-postgres-permissions.sh
      - name: Test server transaction identity and pooled isolation
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/synqforge_test
        run: npm run test:postgres-runtime
