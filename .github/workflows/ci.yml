name: SynqForge CI
on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run test:auth-identity
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
